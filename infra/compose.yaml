
services:
  postgres:
    image: postgres:16-alpine
    container_name: ride360_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ride360}
      POSTGRES_USER: ${POSTGRES_USER:-ride360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - ride360_pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ride360_pgdata:
