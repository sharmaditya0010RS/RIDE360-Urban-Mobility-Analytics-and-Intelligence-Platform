
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ride360"
version = "0.1.0"
description = "Ride Booking Analytics and BI Platform"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1,<3",
    "python-dotenv>=1,<2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1"
]

[project.scripts]
ride360 = "ride360.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
